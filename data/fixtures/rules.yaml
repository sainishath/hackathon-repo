description: "Institutional Procurement Rules — Verified 2024 Goods Manual & Institute Annex 2026"

required_inputs:
  - category
  - estimated_value_inr
  - item_description

rules:
  - rule_id: "RULE_DIRECT_PURCHASE"
    citations:
      - "MGP-2024-C4.12"
      - "INST-2026-DP1"
    description: "Direct Purchase without Quotation up to INR 50,000 sanctioned by HoD"
    when:
      category_in: ["goods"]
      min_value: 0.0
      max_value: 50000.0
      inclusive_min: true
      inclusive_max: true
    then:
      method: "Direct Purchase without Quotation"
      approver: "Head of Department (HoD)"
      min_quotations: 0
      committee_required: false
      required_documents:
        - "FORM-INDENT"
        - "Sanction Order"

  - rule_id: "RULE_PURCHASE_COMMITTEE"
    citations:
      - "MGP-2024-C4.13"
      - "INST-2026-DP2"
    description: "Purchase by Local Purchase Committee from INR 50,001 to INR 5,00,000 sanctioned by Dean"
    when:
      category_in: ["goods"]
      min_value: 50000.0
      max_value: 500000.0
      inclusive_min: false
      inclusive_max: true
    then:
      method: "Purchase by Local Purchase Committee"
      approver: "Dean (R&D / Academic)"
      min_quotations: 3
      committee_required: true
      required_documents:
        - "FORM-INDENT"
        - "FORM-CSQ"
        - "FORM-PCC"
        - "Sanction Order"

  - rule_id: "RULE_LIMITED_TENDER"
    citations:
      - "GFR-2017-R162"
      - "INST-2026-DP3"
    description: "Limited Tender Enquiry (LTE) from INR 5,00,001 to INR 25,00,000 sanctioned by Director"
    when:
      category_in: ["goods"]
      min_value: 500000.0
      max_value: 2500000.0
      inclusive_min: false
      inclusive_max: true
    then:
      method: "Limited Tender Enquiry (LTE)"
      approver: "Director"
      min_quotations: 3
      committee_required: true
      required_documents:
        - "FORM-INDENT"
        - "Tender Enquiry Document"
        - "FORM-CSQ"
        - "Sanction Order"

  - rule_id: "RULE_OPEN_TENDER"
    citations:
      - "GFR-2017-R161"
      - "INST-2026-DP3"
    description: "Advertised Open Tender exceeding INR 25,00,000 sanctioned by Director / Board of Governors"
    when:
      category_in: ["goods"]
      min_value: 2500000.0
      max_value: null
      inclusive_min: false
      inclusive_max: true
    then:
      method: "Advertised Tender Enquiry (ATE / CPPP / GeM)"
      approver: "Director / Board of Governors"
      min_quotations: 3
      committee_required: true
      required_documents:
        - "Open Tender Notice"
        - "CPPP / GeM Publication Proof"
        - "FORM-CSQ"
        - "Technical Evaluation Matrix"
        - "Sanction Order"

  - rule_id: "RULE_EMERGENCY"
    citations:
      - "INST-2026-DP4"
    description: "Emergency Urgency Procurement up to INR 50,000 sanctioned by HoD reporting to Director within 48h"
    when:
      category_in: ["goods"]
      is_emergency: true
      min_value: 0.0
      max_value: 50000.0
      inclusive_min: true
      inclusive_max: true
    then:
      method: "Emergency Purchase under Delegated Powers"
      approver: "Head of Department (Report to Director within 48h)"
      min_quotations: 0
      committee_required: false
      required_documents:
        - "FORM-INDENT"
        - "Emergency Sanction Certificate"
        - "Ratification Report to Director"

  - rule_id: "RULE_SOLE_SOURCE"
    citations:
      - "GFR-2017-R166"
      - "INST-2026-DP3"
    description: "Proprietary Article / Sole Source Procurement approved by Director"
    when:
      category_in: ["goods", "services"]
      is_sole_source: true
    then:
      method: "Single Tender Enquiry (Sole Source / Proprietary)"
      approver: "Director"
      min_quotations: 1
      committee_required: false
      required_documents:
        - "Proprietary Article Certificate (PAC)"
        - "FORM-INDENT"
        - "Director Sanction Order"
